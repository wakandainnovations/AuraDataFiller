table.name=movies_data_collection

# Fuzzy duplicate detection thresholds (pg_trgm similarity, 0.0-1.0)
# Incoming names >= automerge threshold are silently merged into the existing canonical name.
# Names between warn and automerge thresholds are logged as potential duplicates but inserted as-is.
fuzzy.automerge.threshold=0.93
fuzzy.warn.threshold=0.75
# Skip fuzzy check entirely when unique pairs exceed this count (too slow for very large datasets)
fuzzy.max.pairs=50000

# ---- Description-based finance enrichment ----
# IMDb list-export CSVs pack budget / worldwide gross / verdict etc. into a single free-text
# "Description" column (e.g. "Budget : 300crWorldwide gross : 1152cr..."). When enabled, this
# is parsed after each CSV's normal import and used to update budget/revenue on the matching
# DB row(s), converting INR crore figures to USD via xe.com historical rates.
# Money fields only ever move upward (GREATEST of current vs. parsed value), so re-running
# this is always safe. Set to false to skip it entirely.
description.finance.enrichment.enabled=true

# External enrichment (GDP, inflation, events)
# Set enrichment.enabled=true to activate.
# Free APIs used:
#   - World Bank (no auth, no cost) for GDP and annual inflation
#   - Anthropic Claude Haiku (requires key in secrets.properties) for event detection
enrichment.enabled=true
enrichment.worldbank.enabled=true
enrichment.claude.enabled=true
# Delay in milliseconds between successive Claude API calls (avoids rate-limit 429s).
enrichment.api.delay.ms=300

# ---- Sacnilk box-office crawler (background daemon; --watch / --batch modes) ----
# Set to false to disable the background crawler entirely.
crawler.enabled=true
# How long (ms) to wait after app startup before the first crawl begins.
# Gives the CSV-import path time to initialise first.
crawler.initial.delay.ms=10000
# Minimum delay (ms) between successive HTTP requests to sacnilk.com.
# robots.txt specifies Crawl-delay: 1 second; 1 500 ms provides a comfortable margin.
crawler.request.delay.ms=1500
# How many hours to sleep between full crawl cycles (default: every 24 hours).
crawler.interval.hours=24
# Levenshtein-ratio threshold (0.0-1.0) for matching movie names to DB entries.
# Shared by all crawler sources. Recommended range: 0.65-0.85.
crawler.match.threshold=0.70

# ---- Box Office Mojo gap-fill crawler (--crawl and --watch/--batch daemon modes) ----
# Set to false to skip the BOM phase entirely.
crawler.bom.enabled=true
# Minimum delay (ms) between successive HTTP requests to boxofficemojo.com.
# No Crawl-delay specified in robots.txt; 2 000 ms used as a polite default.
crawler.bom.delay.ms=2000

# ---- Koimoi gap-fill crawler (--crawl and --watch/--batch daemon modes) ----
# Set to false to skip the Koimoi phase entirely.
crawler.koimoi.enabled=true
# Minimum delay (ms) between successive HTTP requests to koimoi.com.
# No Crawl-delay specified in robots.txt; 2 000 ms used as a polite default.
crawler.koimoi.delay.ms=2000

# Note: imdb.com is intentionally not crawled — its robots.txt disallows automated
# crawlers for all search paths (/search/, /find/) for non-whitelisted user-agents.

# ---- Actor data collection service (background daemon; --watch / --batch modes) ----
# Set to false to disable the background actor collector entirely.
actor.collector.enabled=true
# How long (ms) to wait after app startup before the first scan begins.
actor.collector.initial.delay.ms=15000
# How many hours to sleep between full scan cycles (default: every 24 hours).
actor.collector.interval.hours=24
# Folder containing actor CSV files to scan. Each CSV row is a movie; actor columns
# (Actor 1, Actor 2, Actor 3, etc.) are expanded into one row per actor.
actor.collector.folder=/Users/mukundv/Documents/work/space/actor_data_collection

# ---- Sacnilk actor filmography crawler (parallel daemon inside actor-data-collector) ----
# Set to false to disable crawling sacnilk for actor filmography pages.
actor.crawler.enabled=true
# How long (ms) to wait before the first crawl (longer than CSV scan so data is in DB first).
actor.crawler.initial.delay.ms=30000
# How many hours to sleep between full crawl cycles.
actor.crawler.interval.hours=24
# Levenshtein-ratio threshold for fuzzy-matching DB actor names to sacnilk URL slugs.
actor.crawler.match.threshold=0.75

# ---- Supplemental actor crawler: kulfiy.com + fandango.com (parallel daemon) ----
# Covers south Indian movies sacnilk may have missed. Only ADDS movies missing for
# an actor — existing (actor, movie, year) rows are never touched.
# Set to false to disable the supplemental crawler entirely.
actor.crawler.supplemental.enabled=true
# How long (ms) to wait before the first crawl (after the sacnilk crawler's delay).
actor.crawler.supplemental.initial.delay.ms=45000
# How many hours to sleep between full crawl cycles.
actor.crawler.supplemental.interval.hours=24
# Per-source toggles.
actor.crawler.kulfiy.enabled=true
actor.crawler.fandango.enabled=true
# No Crawl-delay specified in either site's robots.txt; 2 000 ms used as a polite default.
actor.crawler.kulfiy.delay.ms=2000
actor.crawler.fandango.delay.ms=2000
# Neither source exposes a language field; fall back to an LLM lookup (Claude Haiku,
# requires anthropic.api.key in secrets.properties) when unresolved, else store 'Unknown'.
actor.crawler.language.llm.enabled=true
actor.crawler.language.llm.delay.ms=300
# Cap on how many actors to process per cycle (0 = no limit). Useful for a bounded trial
# run before opening this up to the full actor list, which can take many hours.
actor.crawler.supplemental.max.actors=0

# ---- YouTube promo-metrics enrichment (--youtube-scan / --youtube-scan-once / --watch daemon) ----
# For each movie released after 2010, searches YouTube for the official trailer, official
# teaser, and first single/song, then stores their publish dates, days-before-release,
# view counts, and comment counts. Most recently released movies are processed first.
# Set to false to disable entirely.
youtube.enabled=true
# How long (ms) to wait after app startup before the first cycle begins.
youtube.initial.delay.ms=10000
# How many hours to sleep between full cycles (default: every 24 hours).
youtube.interval.hours=24
# There's no API to check remaining quota up front — the only signal is a real call failing
# with a quota-exceeded response. When that happens (--youtube-scan long-running mode only;
# --youtube-scan-once just logs and exits), retry after this many hours instead of waiting for
# the full youtube.interval.hours — quota resets daily (~midnight Pacific), so a few hours is
# usually enough to catch the reset without wastefully polling.
youtube.quota.retry.hours=3
# Minimum delay (ms) between successive YouTube Data API requests.
youtube.request.delay.ms=350
# YouTube Data API v3 quota budget spent per cycle, in units. search.list costs 100
# units/call, videos.list costs 1 unit/call regardless of how many video ids are batched
# in. Up to 3 searches/movie (trailer+teaser+song) means ~301 units/movie worst case, so
# the default 10,000-unit free daily quota processes roughly 30 movies per cycle. Raise
# this if you have a higher approved quota.
youtube.daily.quota.units=10000
# How many candidate movies to load per cycle before applying the quota budget above.
# Just a query LIMIT to avoid loading the whole (350k+ row) backlog into memory; the
# quota budget above is what actually bounds how many get processed.
youtube.candidate.batch.size=500
# How many years before release_date to search within, to bound promotional videos to a
# plausible release-campaign window and filter out unrelated older uploads.
youtube.promo.window.years=2
# How many months before release_date to search within for the first-song/single query. Kept
# tighter than the trailer/teaser window above: songs release close to the movie, and a wide
# window risks an old unrelated upload (that happens to mention the movie name) winning just
# by being chronologically "earliest".
youtube.song.window.months=6
# Fraction (0.0-1.0) of the movie name's words that must appear in a candidate video's
# title for it to be accepted as a match. Video titles carry extra decoration
# ("Official Trailer | Actor Name"), so this checks containment, not full-string equality.
youtube.match.threshold=0.75
# A movie with no confident match is not re-searched (and re-billed 100 quota units) for
# this many days, so a handful of unmatched recent releases can't perpetually crowd out
# the rest of the backlog. It will still be retried eventually, in case the video simply
# wasn't uploaded yet at the time it was first checked.
youtube.recheck.interval.days=30

# ---- Runtime/budget backfill (--runtime-budget-scan / --runtime-budget-scan-once / --watch daemon) ----
# Fills the "runtime" and "budget" columns (sacnilk.com) for Indian-language movies released
# after 2000 whose runtime or budget is currently 0, most recently released first. Budget is
# parsed in INR Crore and converted to whole USD via the INR→USD rate on the movie's release
# date (currency_rate_xe cache, same as SacnilkCrawlerService/Koimoi phase).
# Set to false to disable entirely.
runtimebudget.enabled=true
# How long (ms) to wait after app startup before the first cycle begins.
runtimebudget.initial.delay.ms=27000
# How many hours to sleep between full cycles (default: every 24 hours).
runtimebudget.interval.hours=24
# How many candidate (movie_name, year) groups to load per cycle before matching against
# sacnilk sitemap slugs. Just a query LIMIT.
runtimebudget.candidate.batch.size=3000
# Levenshtein-ratio threshold (0.0-1.0) for matching movie names to sacnilk sitemap entries.
runtimebudget.match.threshold=0.70
# Minimum delay (ms) between successive HTTP requests to sacnilk.com.
# robots.txt specifies Crawl-delay: 1 second; 1 500 ms provides a comfortable margin.
runtimebudget.sacnilk.delay.ms=1500
# A movie no source has runtime/budget data for is not re-attempted for this many days, so
# the long tail of movies missing everywhere can't perpetually crowd out fresh candidates
# in every cycle's batch. It is still retried eventually, in case site coverage improves.
runtimebudget.recheck.interval.days=14
# Gap-fill sources tried in order after sacnilk, for movies sacnilk didn't have data for.
# boxofficeindex.in/cinefry.co.in/tenvow.com can supply BOTH runtime and budget (checked
# 2026-07-19: each site's robots.txt allows the paths used below; none specify a Crawl-delay,
# so a polite default is applied). BOM and Koimoi (existing box-office crawler sources) only
# ever supply "budget" — neither exposes a runtime field.
# boxofficeindex.in: sitemap-based (like sacnilk), small catalog of mostly 2025/2026 titles.
runtimebudget.boxofficeindex.enabled=true
runtimebudget.boxofficeindex.delay.ms=1500
# cinefry.co.in: sitemap-based, name-only match (its slugs carry no release year).
runtimebudget.cinefry.enabled=true
runtimebudget.cinefry.delay.ms=1500
# tenvow.com: live-search-based (its slugs are too inconsistent to reconstruct a name from).
runtimebudget.tenvow.enabled=true
runtimebudget.tenvow.delay.ms=2000
# boxofficemojo.com / koimoi.com: budget-only gap-fill, mirrors the box-office crawler's
# sacnilk -> BOM -> koimoi priority.
runtimebudget.bom.enabled=true
runtimebudget.bom.delay.ms=2000
runtimebudget.koimoi.enabled=true
runtimebudget.koimoi.delay.ms=2000

# ---- Legacy Bollywood CSV backfill (--legacy-csv-import, one-shot) ----
# Fills pre-existing columns (genre, release_event_type, revenue, budget, number_of_screens,
# runtime, rating_10) in movies_data_collection from historical CSV/XLSX files that carry no
# release_date/language — rows are matched to existing Hindi movies by title only, and only
# fields currently empty/zero are filled. Never creates new columns.
legacycsv.folder=/Users/mukundv/Documents/work/space/new_data_collection
# Filenames (case-insensitive, comma-separated) trusted to WRITE to the DB at all — both
# UPDATE-ing (filling blanks on) an existing unique match, and INSERT-ing a brand-new row
# (release_date "Unknown", language "hindi") when a title has no existing match. Any file not
# on this list — including the .xlsx workbook, which is never eligible — is report-only:
# matches/unmatched/ambiguous are still counted for the summary, but nothing is ever written.
# This is deliberately an explicit allowlist rather than "every CSV in the folder": a file
# dropped in here isn't necessarily Hindi/Bollywood data (e.g. a Tamil- or Hollywood-titled
# dataset), and matching by title alone against an unverified source is exactly how an
# unrelated same-titled movie's real budget/runtime/rating ended up overwriting the wrong
# movie's row in this table (confirmed twice — see LegacyCsvBackfillService's javadoc).
# Vet a new file's content before adding it here.
legacycsv.insert.new.movies.files=Data_for_repository.csv,Kaggle_1.csv

# ---- Tamil CSV import (--tamil-csv-import, one-shot) ----
# Fills pre-existing columns (genre, runtime, budget, revenue, rating_10, directors,
# production_companies, release_day) in movies_data_collection from the files listed below
# (found in legacycsv.folder), explicitly marking every row's language as "tamil". Unlike the
# Hindi legacy-CSV backfill, these files carry a real Release_Date, so rows are matched by
# (movie_name, release year, language='tamil') rather than title alone — much safer, since a
# year lets two different same-titled movies be told apart. Same explicit-allowlist principle
# as legacycsv.insert.new.movies.files: only vetted Tamil-movie files belong here.
tamilcsv.files=tamil_movies_2015_2026.csv

# ---- Kannada budget/revenue import (--kannada-budget-import, one-shot) ----
# Backfills budget/revenue (USD) in movies_data_collection from a single mtwikiblog.com article
# covering Karnataka-territory box office for movies released around 2022/2023/2026. INR->USD
# uses fixed rates for those three years (80/83/95) rather than xe.com — see
# KannadaBudgetBackfillService for full per-row handling rules.
kannadabudget.llm.timeout.seconds=60
kannadabudget.llm.delay.ms=500

# ---- Language identification (--language-id-scan / --language-id-scan-once / --watch daemon) ----
# Identifies language for movies_data_collection rows currently language='unknown' via AuraLLM.
# This table is a general worldwide catalog (not Indian-cinema-specific), so no language/region
# pre-filter is applied — every unknown row is a candidate. Processes a bounded batch per cycle
# rather than the whole backlog at once (it can be in the thousands); repeat cycles (or --watch)
# make steady progress. A row AuraLLM can't confidently resolve is rechecked after the interval
# below rather than retried every single cycle.
languageid.enabled=true
languageid.initial.delay.ms=30000
languageid.interval.hours=24
languageid.batch.size=500
languageid.recheck.interval.days=14
languageid.llm.delay.ms=400
languageid.llm.timeout.seconds=60

# ---- AuraLLM (local Ollama / Bedrock-backed chat gateway — see wakanda/aura/AuraLLM) ----
# POST {"prompt": "..."} returns the model's raw generated text. Shared with AuraService's
# own llm.url — point both at the same running AuraLLM instance.
llm.url=http://localhost:1025/api/chat

# ---- Marketing-tactics classification (--marketing-tactics-scan / --marketing-tactics-scan-once / --watch daemon) ----
# For each already-released movie from movies_data_collection and managed_entities
# (type='MOVIE'), released within the last marketingtactics.lookback.years years, asks AuraLLM
# (a movie-marketing-expert persona prompt, see MarketingTacticsService) which tactics from the
# fixed taxonomy in MarketingTacticTaxonomy were used in its promotional campaign, most recently
# released first, and stores the classified results in movie_marketing_tactics. Not restricted
# to Indian languages — unlike most other enrichment services here, tactic classification isn't
# language-specific. Set to false to disable entirely.
marketingtactics.enabled=true
# How long (ms) to wait after app startup before the first cycle begins.
marketingtactics.initial.delay.ms=35000
# How many hours to sleep between full cycles. 0 = run back-to-back with no gap (needed here:
# ~443K movies remain and each cycle only covers candidate.batch.size, so at a real 24h interval
# the backlog would never finish; back-to-back cycles at ~25 min/200-movie cycle clear it in
# roughly a month of continuous running).
marketingtactics.interval.hours=0
# How many years back from today to scan (default 20 — e.g. 2026 covers 2006-2026).
marketingtactics.lookback.years=20
# How many candidate (movie_name, year, language) groups to load per cycle before applying the
# per-cycle batch above. Just a query LIMIT — kept modest since each candidate is one LLM call.
marketingtactics.candidate.batch.size=200
# Minimum delay (ms) between successive AuraLLM requests.
marketingtactics.llm.delay.ms=500
# Timeout (seconds) per AuraLLM call — a local model generating a long JSON response can be slow.
marketingtactics.llm.timeout.seconds=120
# A movie already classified (successfully or with zero tactics found) is not re-sent to the LLM
# for this many days, so the one-shot 20-year backlog isn't endlessly repeated; still eventually
# retried in case the taxonomy grows or an earlier response was malformed.
marketingtactics.recheck.interval.days=180

# ---- Release-event classification (--release-event-scan / --release-event-scan-once / --release-event-recheck-normal / --watch daemon) ----
# For each Indian-language movies_data_collection row with a full YYYY-MM-DD release_date and
# no release_event_type yet, most-recently-released first, resolves the row's country from its
# language (CountryResolver — always India for this filter) and, for languages with one clear
# home state (Tamil -> Tamil Nadu, Kannada -> Karnataka, Malayalam -> Kerala, etc. — see
# ReleaseEventService.INDIAN_STATE_BY_LANGUAGE), that state, then asks AuraLLM whether a
# Holiday, Festival, Election (national or that state's), Cricket World Cup, or Football World
# Cup match fell within 7 days of that release date — else "Normal". Fills release_event_type/
# release_event_name/release_event_detail (see ReleaseEventService). Results are cached per
# (release_date, country, state) within a cycle, since many Indian movies in the same language
# share an exact release date (a Friday). Set to false to disable entirely.
releaseevent.enabled=true
# How long (ms) to wait after app startup before the first cycle begins.
releaseevent.initial.delay.ms=40000
# How many hours to sleep between full cycles (default: every 24 hours). The initial ~14K-row
# Indian-language backlog was cleared with this temporarily set to 0 (back-to-back cycles,
# mirroring marketingtactics.interval.hours=0) — once cleared, this is set back to a real
# interval so future newly-added rows aren't scanned in a tight loop.
releaseevent.interval.hours=24
# How many candidate rows to load per cycle before applying the cache above. Just a query LIMIT.
releaseevent.candidate.batch.size=300
# Minimum delay (ms) between successive AuraLLM requests (cache hits skip this entirely).
releaseevent.llm.delay.ms=500
# Timeout (seconds) per AuraLLM call.
releaseevent.llm.timeout.seconds=60
# A row already classified (successfully or with an unresolvable country) is not re-checked for
# this many days, so the backlog isn't endlessly repeated; still eventually retried in case
# CountryResolver gains new languages or an earlier response was malformed.
releaseevent.recheck.interval.days=180
# Max rows to load in one --release-event-recheck-normal run (a query LIMIT, not a per-cycle
# batch — this command processes its whole result set in a single invocation). Covers rows
# classified "Normal" AND rows still unclassified (NULL/blank release_event_type). Set
# comfortably above the current combined row count; rerun the command if it's ever exceeded.
releaseevent.recheck.normal.batch.size=10000

# ---- Movie-details enrichment (--movie-details-scan / --movie-details-scan-once / --watch daemon) ----
# Fills pre-existing columns (rating_10, runtime, genre, country, production_companies,
# directors, cbfc_rating) in movies_data_collection from the real TMDB (The Movie Database) API,
# grouped by (movie_name, release year) — one lookup's answer per group is applied to every
# language-dub row in it, mirroring CreditsCrawlerService. Only ever fills a field that is
# currently missing/zero; never overwrites a value obtained elsewhere. Not restricted to Indian
# languages. Replaced an earlier AuraLLM-guessing version of this service (see
# MovieDetailsService javadoc) — TMDB is a real, continuously maintained database, so unlike the
# LLM version there's no knowledge-cutoff restriction: every release year is a valid candidate.
# Requires a TMDB credential in secrets.properties (tmdb.api.read.access.token, the v4 "API Read
# Access Token", preferred when present; else tmdb.api.key, the classic v3 "API Key" — get either
# free at themoviedb.org/settings/api). Set to false to disable entirely.
moviedetails.enabled=true
# How long (ms) to wait after app startup before the first cycle begins.
moviedetails.initial.delay.ms=45000
# How many hours to sleep between full cycles. 0 = run back-to-back with no gap (same reasoning
# as marketingtactics.interval.hours=0: this table's worldwide backlog is large — hundreds of
# thousands of movie groups — so at a real 24h interval it would never meaningfully progress;
# back-to-back cycles let it run continuously as a daemon (started alongside LanguageIdService,
# both process movies_data_collection concurrently — see moviedetails class javadoc for why they
# don't interfere: disjoint target columns, and neither filters or writes the other's column).
# Once the backlog is mostly cleared, set this back to a real interval (e.g. 24) so future newly
# added rows aren't scanned in a tight loop.
moviedetails.interval.hours=0
# How many candidate (movie_name, year) groups to load per cycle before applying the batch — a
# query LIMIT. TMDB has no local-model timeout risk and a generous rate limit, so this can be
# much larger than the old LLM-based default.
moviedetails.candidate.batch.size=1000
# A movie group already checked (successfully or with no confident TMDB match) is not re-sent
# for this many days, so the backlog isn't endlessly repeated; still eventually retried in case
# TMDB's catalog grows or gains a certification/vote count it didn't have before.
moviedetails.recheck.interval.days=180
# How many candidate TMDB lookups to run concurrently within one cycle. Measured in practice: a
# single-threaded loop only used ~2 of TMDB's ~35 req/s budget (almost all time was spent
# blocked waiting on one HTTP round trip before starting the next), so this can safely be well
# above 1 — TmdbClient's own rate limiter (tmdb.rate.limit.requests.per.second) still caps actual
# request issuance regardless of pool size, so raising this doesn't risk exceeding TMDB's limit.
# DB writes are NOT parallelised (a JDBC connection isn't safe for concurrent use) — only the
# TMDB lookups run concurrently; see MovieDetailsService's javadoc.
moviedetails.concurrency=20

# ---- TMDB (The Movie Database) API — used by moviedetails.* above ----
# TMDB documents a ~40 requests/second limit. Enforced per-HTTP-request inside TmdbClient (not
# just once per candidate movie — a single candidate can fan out into several search requests
# across title aliases/matching passes plus a details call), so a multi-alias title can't burst
# past this. Kept a bit under the documented 40 as a safety margin.
tmdb.rate.limit.requests.per.second=35
# Timeout (seconds) per TMDB request.
tmdb.request.timeout.seconds=15
# Levenshtein-ratio threshold (0.0-1.0) for matching a DB movie_name to a TMDB search result's
# title — same convention as crawler.match.threshold/credits.match.threshold elsewhere in this
# app. A same-titled result within 1 release year of the DB row (rather than an exact year
# match) is held to a stricter threshold (this value + 0.10, hardcoded in TmdbClient) — see
# TmdbClient's javadoc for the full matching/disambiguation rules (year, title, and — when the
# DB row's language is known — original_language must all line up before a match is accepted).
tmdb.match.threshold=0.70

# ---- India movies catalog import (--india-movies-import-once, one-shot) ----
# Reads every India-origin movie TMDB has on file (indiamovies.year.from to indiamovies.year.to,
# via /discover/movie) with both a non-zero budget AND revenue on record, and saves it into a
# brand-new india_movies_data_collection table — created as an exact schema mirror of
# table.name (movies_data_collection) via CREATE TABLE ... LIKE ... INCLUDING ALL, keyed by the
# same (movie_name, release_date, language) primary key. Never touches movies_data_collection
# itself. Unlike moviedetails.* above, there's no fuzzy title matching here — /discover/movie
# returns unambiguous TMDB ids directly — but budget/revenue aren't filterable through discover
# itself, so every discovered id still needs its own details call to check them.
indiamovies.target.table=india_movies_data_collection
# How many concurrent TMDB details lookups to run per year — same reasoning as
# moviedetails.concurrency (TmdbClient's own rate limiter still caps actual request issuance).
indiamovies.concurrency=20
# Inclusive year range to scan.
indiamovies.year.from=2006
indiamovies.year.to=2026
